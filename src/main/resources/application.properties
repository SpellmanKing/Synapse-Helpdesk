spring.application.name=helpdesk

# Active Profiles: dev by default
spring.profiles.active=dev

# H2 Database configuration (dev profile)
spring.datasource.url=jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hugging Face config
langchain4j.hugging-face.chat-model.api-key=${HUGGING_FACE_API_KEY:}
langchain4j.hugging-face.chat-model.model-id=Qwen/Qwen2.5-7B-Instruct
# Timeout in seconds
langchain4j.hugging-face.chat-model.timeout-seconds=60

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.synapse.helpdesk=DEBUG
